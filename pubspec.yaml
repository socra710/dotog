name: dotog
description: DOTOG 유휴 MUD 프로토타입
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_analytics: ^11.4.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.5
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NeoDGM
      fonts:
        - asset: assets/fonts/NeoDGM.ttf
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
